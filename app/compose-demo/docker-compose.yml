services:
  web:
    build: .
    depends_on:
      - db
    ports:
      - "6161:8000"
  db:
    image: postgres:15-alpine
    volumes: 
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=ekrem
      - POSTGRES_PASSWORD=ekrem6161
      - POSTGRES_DB=demo_db

volumes:
  postgres_data:
