name: "IaC Deployment Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "iac/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      target:
        description: "Target resource or module (e.g. 'module.ecs' or 'module.rds'). Leave empty for full stack."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ github.ref }}-${{ inputs.environment || 'push' }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Manual Targeted Deployment (Triggered via workflow_dispatch)
  # -------------------------------------------------------------
  deploy-targeted:
    name: "Manual Deploy: ${{ inputs.environment }} ${{ inputs.target != '' && format('({0})', inputs.target) || '(full stack)' }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::000000000000:role/github-actions-role' }}
          role-session-name: gha-manual-deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: iac/environments/${{ inputs.environment }}

      - name: Generate Plan
        run: |
          TARGET_ARGS=""
          if [ -n "${{ inputs.target }}" ]; then
            echo "Targeted deployment requested for: ${{ inputs.target }}"
            for item in ${{ inputs.target }}; do
              TARGET_ARGS="$TARGET_ARGS -target=$item"
            done
          else
            echo "Full environment deployment for: ${{ inputs.environment }}"
          fi
          terraform plan $TARGET_ARGS -out=tfplan
        working-directory: iac/environments/${{ inputs.environment }}

      - name: Apply Plan
        run: terraform apply tfplan
        working-directory: iac/environments/${{ inputs.environment }}

      - name: Smoke Test
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ]; then
            echo "Testing ALB healthcheck endpoint: http://$ALB_DNS/health"
            curl --fail --retry 5 --retry-delay 10 --connect-timeout 5 "http://$ALB_DNS/health" || true
          fi
        working-directory: iac/environments/${{ inputs.environment }}

  # -------------------------------------------------------------
  # Automated Progressive Deployment (Triggered on Push to main)
  # -------------------------------------------------------------
  deploy-dev:
    name: "Deploy: Dev"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::000000000000:role/github-actions-dev-role' }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: iac/environments/dev

      - name: Generate Plan
        run: terraform plan -out=tfplan
        working-directory: iac/environments/dev

      - name: Apply Plan
        run: terraform apply tfplan
        working-directory: iac/environments/dev

      - name: Smoke Test (Dev Health)
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ]; then
            echo "Testing Dev ALB healthcheck: http://$ALB_DNS/health"
            curl --fail --retry 5 --retry-delay 10 --connect-timeout 5 "http://$ALB_DNS/health" || true
          fi
        working-directory: iac/environments/dev

  deploy-staging:
    name: "Deploy: Staging"
    if: github.event_name == 'push'
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::000000000000:role/github-actions-staging-role' }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: iac/environments/staging

      - name: Generate Plan
        run: terraform plan -out=tfplan
        working-directory: iac/environments/staging

      - name: Apply Plan
        run: terraform apply tfplan
        working-directory: iac/environments/staging

      - name: Smoke Test (Staging Health)
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ]; then
            echo "Testing Staging ALB healthcheck: http://$ALB_DNS/health"
            curl --fail --retry 5 --retry-delay 10 --connect-timeout 5 "http://$ALB_DNS/health" || true
          fi
        working-directory: iac/environments/staging

  deploy-prod:
    name: "Deploy: Production"
    if: github.event_name == 'push'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production # Enforces GitHub Manual Approval Gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::000000000000:role/github-actions-prod-role' }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: iac/environments/prod

      - name: Generate Plan
        run: terraform plan -out=tfplan
        working-directory: iac/environments/prod

      - name: Apply Plan
        run: terraform apply tfplan
        working-directory: iac/environments/prod
